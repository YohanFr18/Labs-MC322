plugins {
    id 'application'
}

// Baixa as dependências (JUnit) do repositório público Maven Central
repositories {
    mavenCentral()
}

dependencies {
    // O BOM ("bill of materials") fixa uma versão coerente para todos os módulos do JUnit
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // A partir do Gradle 9 o launcher do JUnit precisa ser declarado explicitamente
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'br.unicamp.ic.mc322.Main'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
}

// Sem isso o Gradle não repassa o teclado para a aplicação e o Scanner recebe EOF
tasks.named('run') {
    standardInput = System.in
}

// Roda os testes com o JUnit 5 (Jupiter). A task build depende de test, então
// ./gradlew build também executa a suíte; o relatório HTML fica em
// build/reports/tests/test/index.html
tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}
